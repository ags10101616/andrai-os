name: ANDRAI OS / OS-01 Quality
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh lockfile once for reviewed OS-07 PDF dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install from bootstrap lockfile
        run: npm ci
      - name: Export validated bootstrap lockfile once
        run: |
          node -e "const fs=require('node:fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); console.log('ANDRAI_OS07_LOCK_BEGIN'); for(let i=0;i<b.length;i+=2048)console.log(b.slice(i,i+2048)); console.log('ANDRAI_OS07_LOCK_END');"
      - name: Validate
        run: npm run lint && npm run typecheck && npm run test && npm run build
      - name: Review dependency security
        run: npm audit --audit-level=high
      - name: Upload synthetic PDF QA sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os07-quote-pdf-qa
          path: tests/artifacts/os07-quote-sample.pdf
          if-no-files-found: ignore
          retention-days: 1
